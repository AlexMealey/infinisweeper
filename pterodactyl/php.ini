; PHP settings for the Pterodactyl egg. The static PHP build it downloads ships without a php.ini; the Docker image
; gets the same from php.ini-production.

; Errors go to the server console, never into the JSON responses. (-q in the startup command hides the built-in
; server's own log, errors included, so they're written to stderr directly.)
display_errors = Off
log_errors = On
error_log = /dev/stderr
